services:
  api:
    build:
      context: .
      dockerfile: src/Todo.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/todo.db"
      RESEND_APIKEY: ${RESEND_APIKEY:-}
      Resend__DevRecipientEmail: ${RESEND_DEV_RECIPIENT_EMAIL:-}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:5173}
      Reminder__TimeZoneId: ${REMINDER_TIME_ZONE_ID:-America/Sao_Paulo}
    volumes:
      - todo-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5080"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

volumes:
  todo-data:
  prometheus-data:
  grafana-data:
