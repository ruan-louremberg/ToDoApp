services:
  api:
    build:
      context: .
      dockerfile: src/Todo.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/todo.db"
    volumes:
      - todo-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5080"
    depends_on:
      - api

volumes:
  todo-data:
